        }
        
        /* 控制面板样式 */
        .control-panel {

        .panel-title {

            font-weight: bold;

            color: #48b5e9;
            text-align: center;
            border-bottom: 2px solid #48b5e9;

        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-weight: 500;
        }
        
        .control-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #555;
            border-radius: 4px;
            background: #2a2d31;
            color: white;
            font-size: 13px;
            box-sizing: border-box;
        }
        
        .control-input:focus {
            outline: none;
            border-color: #48b5e9;
            box-shadow: 0 0 5px rgba(72, 181, 233, 0.3);
        }
        
        .slider-container {
            margin-top: 10px;
        }
        
        .slider {
            width: 100%;
            margin: 10px 0;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: #555;
            outline: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #48b5e9;
            cursor: pointer;
        }
        
        .slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #48b5e9;
            cursor: pointer;
            border: none;
        }
        
        .slider-value {
            text-align: center;
            margin-top: 5px;
            color: #48b5e9;
            font-weight: bold;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #48b5e9;
            color: white;
        }
        
        .btn-primary:hover {
            background: #3a9bc9;
        }
        
        .btn-secondary {
            background: #666;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #777;
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c0392b;
        }
        
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        
        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }
        
        .file-input-label {
            display: block;
            padding: 8px 12px;
            background: #2a2d31;
            border: 1px solid #555;
            border-radius: 4px;
            color: #ddd;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        
        .file-input-label:hover {
            border-color: #48b5e9;
            color: #48b5e9;
        }
        
        .tip {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid #ffc107;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 15px;
            color: #ffc107;
            font-size: 12px;
        }

        viewer.imageryLayers.addImageryProvider(imageryLayer);
        viewer.imageryLayers.addImageryProvider(labelLayer);

        // 启用地形深度测试
        viewer.scene.globe.depthTestAgainstTerrain = true;

        let tileset;
        
        // 加载模型
        async function addModel() {
                console.log('开始加载3D模型...');
                let layer = await Cesium.Cesium3DTileset.fromUrl(
                    "/data95/项目/模型/Tileset.json"
                );
                
                tileset = viewer.scene.primitives.add(layer);
                
                var boundingSphere = tileset.boundingSphere;
                //迪卡尔空间直角坐标=>地理坐标（弧度制）
                var cartographic_original = Cesium.Cartographic.fromCartesian(boundingSphere.center);
                //设置新的经度、纬度、高度
                var cartographic_offset  = Cesium.Cartographic.fromDegrees(116.37345909, 39.8931285292, 0)
                //地理坐标（弧度制）=>迪卡尔空间直角坐标
                var Cartesian3_original = Cesium.Cartesian3.fromRadians(cartographic_original.longitude, cartographic_original.latitude, cartographic_original.height);
                var Cartesian3_offset  = Cesium.Cartesian3.fromRadians(cartographic_offset.longitude, cartographic_offset.latitude, cartographic_offset.height);
                //获得地面和offset的转换
                var translation = Cesium.Cartesian3.subtract(Cartesian3_offset, Cartesian3_original, new Cesium.Cartesian3());
                //修改模型矩阵
                tileset.modelMatrix = Cesium.Matrix4.fromTranslation(translation);
                   
                // 定位到模型位置
                viewer.zoomTo(tileset);
                console.log('3D模型加载完成');
                
        }

        // 全局变量
        let distanceAnalyzer = null;
        let spacingValue = 20;

        // 初始化控制面板事件
        function initControls() {
            const spacingSlider = document.getElementById('spacingSlider');
            const spacingValueDisplay = document.getElementById('spacingValue');
            const analyzeBtn = document.getElementById('analyzeBtn');
            const clearBtn = document.getElementById('clearBtn');

            // 滑块事件
            spacingSlider.addEventListener('input', function() {
                spacingValue = parseInt(this.value);
                spacingValueDisplay.textContent = spacingValue;
            });

            // 分析按钮事件
            analyzeBtn.addEventListener('click', async function() {
                await performAnalysis();
            });

            // 清除按钮事件
            clearBtn.addEventListener('click', function() {
                clearAnalysis();
            });
        }

        // 执行建筑间距分析
        async function performAnalysis() {
            try {
                console.log('开始建筑间距分析，间距值:', spacingValue);
                
                // 如果已有分析器，先销毁
                if (distanceAnalyzer) {
                    distanceAnalyzer.destroy();
                }

                // 创建分析工具实例
                distanceAnalyzer = new BuildingDistanceAnalyzer(viewer, {
                    lineColor: Cesium.Color.YELLOW,
                    lineWidth: 2,
                    pointColor: Cesium.Color.RED,
                    labelColor: Cesium.Color.WHITE,
                    showBuilding: false, // 不显示建筑
                    showBuildingOutline: true, // 但显示建筑轮廓
                    labelBackground: false, // 显示标签背景
                    labelBackgroundColor: Cesium.Color.BLACK.withAlpha(0.7), // 黑色半透明背景
                    showLineWhenOccluded: false, // 遮挡时不显示连接线
                    showLabelWhenOccluded: true, // 遮挡时仍然显示标签
                    // 自定义不同距离区间的颜色
                    distanceColorRanges: {
                        default: [
                            { min: 0, max: spacingValue, color: Cesium.Color.RED },
                            { min: spacingValue, max: spacingValue * 1.2, color: Cesium.Color.ORANGE },
                            { min: spacingValue * 1.2, max: spacingValue * 2, color: Cesium.Color.GREEN }
                        ]
                    }
                });

                console.log('分析器创建完成，开始添加建筑数据...');
                
                // 添加建筑数据
                await distanceAnalyzer.addBuildingFromGeoJson(buildingData);
                
                console.log('建筑数据添加完成，开始分析...');
                
                // 执行分析
                const results = distanceAnalyzer.analyzeAllBuildings(null, spacingValue * 1.6);
                
                console.log('建筑间距分析完成，共找到', results.length, '个建筑对');
            } catch (error) {
                console.error('分析过程中出现错误:', error);
                alert('分析失败，请检查控制台错误信息');
            }
        }

        // 清除分析结果
        function clearAnalysis() {
            if (distanceAnalyzer) {
                distanceAnalyzer.clearAnalysisResults();
                console.log('已清除分析结果');
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initControls();
        });

    </script>
